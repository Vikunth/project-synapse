<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
  <title id="title">B4 concurrency saturation</title>
  <desc id="desc">A dual-axis line chart shows aggregate generated tokens per second and p95 request latency at concurrency 1, 4, 8, and 16.</desc>
  <rect width="1040" height="680" fill="#ffffff"/>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#526079}.axis{stroke:#526079;stroke-width:1}.grid{stroke:#d9dee8;stroke-width:1}.tick{font-size:13px}.label{font-size:14px;font-weight:600}.value{font-size:12px;font-weight:700}.note{font-size:13px;fill:#526079}</style>
  <text x="70" y="48" class="title">B4: concurrency saturation</text>
  <text x="70" y="76" class="subtitle">Aggregate throughput plateaus while tail latency continues to rise</text>
  <line x1="95" y1="500.0" x2="930" y2="500.0" class="grid"/>
  <text x="81" y="505.0" text-anchor="end" class="tick">0</text>
  <text x="944" y="505.0" class="tick">0</text>
  <line x1="95" y1="425.0" x2="930" y2="425.0" class="grid"/>
  <text x="81" y="430.0" text-anchor="end" class="tick">1</text>
  <text x="944" y="430.0" class="tick">20</text>
  <line x1="95" y1="350.0" x2="930" y2="350.0" class="grid"/>
  <text x="81" y="355.0" text-anchor="end" class="tick">2</text>
  <text x="944" y="355.0" class="tick">40</text>
  <line x1="95" y1="275.0" x2="930" y2="275.0" class="grid"/>
  <text x="81" y="280.0" text-anchor="end" class="tick">3</text>
  <text x="944" y="280.0" class="tick">60</text>
  <line x1="95" y1="200.0" x2="930" y2="200.0" class="grid"/>
  <text x="81" y="205.0" text-anchor="end" class="tick">4</text>
  <text x="944" y="205.0" class="tick">80</text>
  <line x1="95" y1="125.0" x2="930" y2="125.0" class="grid"/>
  <text x="81" y="130.0" text-anchor="end" class="tick">5</text>
  <text x="944" y="130.0" class="tick">100</text>
  <line x1="95" y1="125" x2="95" y2="500" class="axis"/>
  <line x1="930" y1="125" x2="930" y2="500" class="axis"/>
  <line x1="95" y1="500" x2="930" y2="500" class="axis"/>
  <text x="24" y="320" transform="rotate(-90 24 320)" class="label">Aggregate tokens/second</text>
  <text x="1010" y="320" transform="rotate(90 1010 320)" class="label">p95 request latency (seconds)</text>
  <line x1="620" y1="98" x2="650" y2="98" stroke="#2457c5" stroke-width="4"/><text x="660" y="103" class="tick">Throughput</text>
  <line x1="770" y1="98" x2="800" y2="98" stroke="#d1495b" stroke-width="4"/><text x="810" y="103" class="tick">p95 latency</text>
  <polyline points="95.0,389.2 373.3,187.3 651.7,150.1 930.0,161.5" fill="none" stroke="#2457c5" stroke-width="4"/>
  <polyline points="95.0,439.2 373.3,416.5 651.7,351.6 930.0,192.6" fill="none" stroke="#d1495b" stroke-width="4"/>
  <circle cx="95.0" cy="389.2" r="6" fill="#2457c5"/>
  <text x="95.0" y="377.2" text-anchor="middle" class="value">1.48 tok/s</text>
  <circle cx="95.0" cy="439.2" r="6" fill="#d1495b"/>
  <text x="95.0" y="461.2" text-anchor="middle" class="value">16.21s</text>
  <text x="95.0" y="527" text-anchor="middle" class="label">c1</text>
  <text x="95.0" y="548" text-anchor="middle" class="tick">n=1</text>
  <circle cx="373.3" cy="187.3" r="6" fill="#2457c5"/>
  <text x="373.3" y="175.3" text-anchor="middle" class="value">4.17 tok/s</text>
  <circle cx="373.3" cy="416.5" r="6" fill="#d1495b"/>
  <text x="373.3" y="438.5" text-anchor="middle" class="value">22.27s</text>
  <text x="373.3" y="527" text-anchor="middle" class="label">c4</text>
  <text x="373.3" y="548" text-anchor="middle" class="tick">n=4</text>
  <circle cx="651.7" cy="150.1" r="6" fill="#2457c5"/>
  <text x="651.7" y="138.1" text-anchor="middle" class="value">4.67 tok/s</text>
  <circle cx="651.7" cy="351.6" r="6" fill="#d1495b"/>
  <text x="651.7" y="373.6" text-anchor="middle" class="value">39.58s</text>
  <text x="651.7" y="527" text-anchor="middle" class="label">c8</text>
  <text x="651.7" y="548" text-anchor="middle" class="tick">n=8</text>
  <circle cx="930.0" cy="161.5" r="6" fill="#2457c5"/>
  <text x="930.0" y="149.5" text-anchor="middle" class="value">4.51 tok/s</text>
  <circle cx="930.0" cy="192.6" r="6" fill="#d1495b"/>
  <text x="930.0" y="214.6" text-anchor="middle" class="value">81.98s</text>
  <text x="930.0" y="527" text-anchor="middle" class="label">c16</text>
  <text x="930.0" y="548" text-anchor="middle" class="tick">n=16</text>
  <text x="512" y="580" text-anchor="middle" class="label">Requested concurrency</text>
  <text x="70" y="618" class="note">Methodology: throughput is generated tokens divided by batch wall time; p95 uses linear interpolation of total request time.</text>
  <text x="70" y="642" class="note">Caveat: each level is one batch with unequal sample counts; results describe this machine and model, not universal capacity.</text>
</svg>
