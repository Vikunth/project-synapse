[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synapse-bench"
version = "0.1.0"
description = "Evidence-first Ollama benchmark harness for Project Synapse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
synapse = "synapse_bench.cli:app"
synapse-bench = "synapse_bench.cli:app"
synapse-proxy = "synapse.__main__:main"

[dependency-groups]
dev = [
  "httpx[http2]>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_bench", "src/synapse"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["synapse_bench", "synapse"]
